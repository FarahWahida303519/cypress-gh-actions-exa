name: Cypress Tests

on:
  push:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs npm dependencies (cached) and runs all Cypress tests
      - name: Cypress run in ${{ matrix.browser }}
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          command: >
            npx cypress run
            --browser ${{ matrix.browser }}
            --reporter-options reportDir=cypress/reports/${{ matrix.browser }},overwrite=false,html=false,json=true

      - name: Merge Mochawesome reports
        if: always()
        run: npx mochawesome-merge "cypress/reports/${{ matrix.browser }}/*.json" > cypress/reports/${{ matrix.browser }}/merged-report.json

      - name: Generate HTML report
        if: always()
        run: npx marge cypress/reports/${{ matrix.browser }}/merged-report.json --reportDir cypress/reports/${{ matrix.browser }} --reportFilename ${{ matrix.browser }}-report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cypress Report - ${{ matrix.browser }}
          path: cypress/reports/${{ matrix.browser }}